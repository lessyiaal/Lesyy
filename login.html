<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesyy | Bağlantılar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050000;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
    }

    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .2);
      pointer-events: none;
      z-index: 1;
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 90px 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(64px, 13vw, 120px);
      letter-spacing: 6px;
      line-height: 1.1;
      text-shadow:
        0 0 6px white,
        0 0 20px rgba(255, 255, 255, .6),
        3px 2px #ab001d;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin: 8px 0;
    }

    .social {
      min-width: 170px;
      padding: 7px 22px;
      border: 2px solid #ff183d;
      border-radius: 10px;
      background: rgba(0, 0, 0, .65);
      color: white;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: bold;
      text-decoration: none;
      box-shadow:
        0 0 7px #ff0033,
        0 0 20px #ff0033,
        inset 0 0 10px #ff003355;
      text-shadow: 0 0 7px white;
      transition: transform .2s, background .2s;
    }

    .social:hover {
      transform: translateY(-3px);
      background: rgba(130, 0, 20, .75);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .tagline {
      margin: 4px 0 0;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow:
        0 0 6px white,
        0 0 16px #ff0033,
        0 0 30px #ff0033;
    }

    .back,
    .video-toggle {
      position: fixed;
      top: 20px;
      z-index: 3;
      border: 1px solid #aaa;
      border-radius: 5px;
      padding: 9px 12px;
      background: rgba(0, 0, 0, .65);
      color: white;
      font: 12px Arial, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .back {
      left: 20px;
    }

    .video-toggle {
      right: 20px;
    }

    @media (max-width: 420px) {
      nav {
        gap: 12px;
      }

      .social {
        min-width: 135px;
        padding: 8px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .social {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <video
    id="background"
    class="background"
    autoplay
    muted
    loop
    playsinline
    aria-hidden="true"
  >
    <source src="./background.mp4" type="video/mp4">
  </video>

  <div class="shade"></div>

  <a class="back" href="./index.html">← Ana sayfa</a>

  <button
    class="video-toggle"
    id="video-toggle"
    type="button"
  >Videoyu durdur</button>

  <main>
    <h1>Lesyy</h1>

    <nav aria-label="Sosyal bağlantılar">
      <a
        class="social"
        href="https://discord.gg/g6Ve3rQA3"
        target="_blank"
        rel="noopener noreferrer"
      >Discord</a>

      <a
        class="social"
        href="https://t.me/darbekodu98827927"
        target="_blank"
        rel="noopener noreferrer"
      >Telegram</a>
    </nav>

    <p class="tagline">LESYY SİKERR</p>
  </main>

  <script>
    const video = document.getElementById("background");
    const toggle = document.getElementById("video-toggle");

    function updateButton() {
      toggle.textContent = video.paused
        ? "Videoyu oynat"
        : "Videoyu durdur";
    }

    video.addEventListener("play", updateButton);
    video.addEventListener("pause", updateButton);
    updateButton();

    toggle.onclick = async () => {
      if (video.paused) {
        try {
          await video.play();
        } catch {
          toggle.textContent = "Oynatılamadı, tekrar dene";
          return;
        }
      } else {
        video.pause();
      }

      updateButton();
    };
  </script>
</body>
</html>
